<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Filterable collection of scripts and one-liners: PowerShell, Bash, Batch, Python.">
  <title>ScriptsRepo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1>Scripts<span>Repo</span></h1>
      <p class="tagline">A filterable collection of handy scripts and one-liners.</p>
    </header>

    <section class="filters" aria-label="Filter the script list">
      <div class="searchbar">
        <input id="search" type="search" placeholder="Search title, description or code (press / to focus)" autocomplete="off">
        <button id="resetFilters" class="btn btn-ghost" type="button">Reset</button>
      </div>
      <div class="chip-group">
        <span class="chip-label">Language</span>
        <div class="chips" id="langChips"></div>
      </div>
      <div class="chip-group">
        <span class="chip-label">Purpose</span>
        <div class="chips" id="purposeChips"></div>
      </div>
      <p id="resultCount" aria-live="polite"></p>
    </section>

    <main id="grid" class="grid" aria-label="Scripts"></main>

    <div id="empty" class="empty" hidden>
      <p>No scripts match your filters.</p>
      <button id="emptyReset" class="btn" type="button">Clear all filters</button>
    </div>

    <footer class="site-footer">
      Click a card for options and the full command. New scripts go in <code>js/data.js</code>, the filters update automatically.
    </footer>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="icon-btn" type="button" aria-label="Close dialog">&#10005;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/data-ad.js"></script>
  <script src="js/data-ir.js"></script>
  <script src="js/data-kql.js"></script>
  <script src="js/data-intune.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
